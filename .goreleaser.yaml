# GoReleaser config for sl-dbg.
# Build matrix kept lean: macOS + Linux, amd64 + arm64. No Windows by design.
#
# Local dry-run:    goreleaser release --snapshot --clean
# Release (CI):     pushed by .github/workflows/release.yml on tag v*

version: 2

project_name: sl-dbg

builds:
  - id: sl-dbg
    main: ./cmd/sl-dbg
    binary: sl-dbg
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/y0geshpatil/sl-dbg/internal/buildinfo.Version={{.Version}}
      - -X github.com/y0geshpatil/sl-dbg/internal/buildinfo.Commit={{.ShortCommit}}
      - -X github.com/y0geshpatil/sl-dbg/internal/buildinfo.Date={{.Date}}

archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    files:
      - README.md
      - LICENSE
      - docs/*.md

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"

# Publish release artifacts to this same repo. Uses the built-in
# GITHUB_TOKEN provided by the release workflow — no cross-repo PAT needed.
release:
  github:
    owner: y0geshpatil
    name: sl-dbg
  extra_files:
    - glob: adapters/java-launcher/target/sl-dbg-java-adapter.jar
    - glob: adapters/java-launcher/target/sl-dbg-java-adapter.jar.sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - Merge pull request
      - Merge branch
