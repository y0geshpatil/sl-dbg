# GoReleaser config for sl-dbg.
# Build matrix kept lean: macOS + Linux, amd64 + arm64. No Windows by design.
#
# Local dry-run:    goreleaser release --snapshot --clean
# Release (CI):     pushed by .github/workflows/release.yml on tag v*

version: 2

project_name: sl-dbg

before:
  hooks:
    - go mod tidy

builds:
  - id: sl-dbg
    main: ./cmd/sl-dbg
    binary: sl-dbg
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/y0geshpatil/sl-dbg/internal/buildinfo.Version={{.Version}}
      - -X github.com/y0geshpatil/sl-dbg/internal/buildinfo.Commit={{.ShortCommit}}
      - -X github.com/y0geshpatil/sl-dbg/internal/buildinfo.Date={{.Date}}

archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    files:
      - README.md
      - LICENSE
      - docs/**/*

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"

# Publish release artifacts to the PUBLIC y0geshpatil/sl-dbg-releases repo
# so end users can install without authenticating to the private source
# repo. The release workflow needs a PAT with `contents: write` on the
# releases repo, exported as GH_RELEASE_TOKEN (see .github/workflows/release.yml).
release:
  github:
    owner: y0geshpatil
    name: sl-dbg-releases

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - Merge pull request
      - Merge branch

# Publish a Homebrew formula to a tap repo on each tagged release.
# Set HOMEBREW_TAP_GITHUB_TOKEN in repo secrets to enable.
# NOTE: `brews:` is deprecated and will be renamed to `homebrew_formulas:`
# in GoReleaser v3 — keep `brews:` until we upgrade.
brews:
  - name: sl-dbg
    description: "Stateless debugger CLI for AI agents and humans (DAP-backed)"
    homepage: "https://github.com/y0geshpatil/sl-dbg"
    license: "Apache-2.0"
    repository:
      owner: y0geshpatil
      name: homebrew-sl-dbg
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    directory: Formula
    install: |
      bin.install "sl-dbg"
    test: |
      assert_match "schema", shell_output("#{bin}/sl-dbg version")
    dependencies:
      - name: openjdk
        type: optional
      - name: python@3.11
        type: optional
    caveats: |
      Language adapters are NOT bundled. After install run:
        sl-dbg install-adapter all
      to fetch / build them (debugpy via pip, dlv via go install,
      Java adapter via Maven build).
