name: ✨ Feature request
description: Suggest a new command, MCP tool, language adapter, or behavior
title: "[feat] "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / use case
      description: What are you trying to do? What's making it hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: |
        Concrete CLI / MCP shape if you have one (e.g. flag names, JSON fields).
        It's OK to leave open if you'd like to discuss first.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: surface
    attributes:
      label: Where does this live?
      multiple: true
      options:
        - CLI command / flag
        - MCP tool
        - Language adapter (python / go / java / new lang)
        - Daemon / IPC
        - Documentation
        - Other
    validations:
      required: true
