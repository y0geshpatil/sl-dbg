name: ❓ Question / usage help
description: Ask how to do something with sl-dbg
title: "[q] "
labels: ["question", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing: skim **[docs/COMMANDS.md](https://github.com/y0geshpatil/sl-dbg/blob/main/docs/COMMANDS.md)** and **[docs/AGENT-GUIDE.md](https://github.com/y0geshpatil/sl-dbg/blob/main/docs/AGENT-GUIDE.md)**. Most "how do I…" answers live there.
  - type: textarea
    id: question
    attributes:
      label: What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What have you tried?
      render: shell
