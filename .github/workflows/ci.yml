name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    name: Go ${{ matrix.go-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        go-version: ['1.22']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Build packages
        run: go build ./...

      - name: Test packages
        run: go test ./...

      - name: Build CLI for e2e
        run: go build -o bin/sl-dbg ./cmd/sl-dbg

      - name: Run Python and Go e2e smoke tests
        shell: bash
        run: |
          if ! compgen -G 'test/e2e/*.sh' >/dev/null; then
            echo 'No e2e shell tests found; skipping.'
            exit 0
          fi
          if ! python3 --version; then
            echo 'python3 unavailable; skipping e2e smoke tests.'
            exit 0
          fi
          python3 -m pip install --user debugpy
          go install github.com/go-delve/delve/cmd/dlv@latest
          export PATH="$(go env GOPATH)/bin:$PATH"
          bash test/e2e/python.sh
          bash test/e2e/go.sh
          # TODO(#32): add JDK setup and run test/e2e/java.sh once CI time allows.
