name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: Go ${{ matrix.go-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        go-version: ['1.22']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Build packages
        run: go build ./...

      - name: Test packages
        run: go test ./...

      - name: Build CLI for e2e
        run: go build -o bin/sl-dbg ./cmd/sl-dbg

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Python and Go e2e smoke tests
        shell: bash
        run: |
          ./bin/sl-dbg install-adapter python
          export PATH="$HOME/.cache/sl-dbg/adapters/python/bin:$PATH"
          go install github.com/go-delve/delve/cmd/dlv@latest
          export PATH="$(go env GOPATH)/bin:$PATH"
          bash test/e2e/python.sh
          bash test/e2e/go.sh

      - name: Setup Java for e2e
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Run Java e2e smoke test
        shell: bash
        run: |
          # install-adapter java uses Strategy 3 (in-tree Maven build) for dev builds:
          # Strategy 1 = SL_DBG_JAVA_ADAPTER_URL env var, Strategy 2 = GitHub Releases download
          # (skipped here because buildinfo.Version == "0.0.0-dev"), Strategy 3 = local Maven.
          # Maven is pre-installed on ubuntu-latest and macos-latest runners.
          ./bin/sl-dbg install-adapter java
          bash test/e2e/java.sh

  release-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - run: make java-adapter
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: v2.16.0
          args: check
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: v2.16.0
          args: release --snapshot --clean
      - name: Verify complete release artifacts
        run: bash scripts/verify-release.sh dist adapters/java-launcher/target
