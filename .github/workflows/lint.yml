name: Lint

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache: true

      - name: Run golangci-lint
        if: ${{ hashFiles('.golangci.yml', '.golangci.yaml') != '' }}
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

      - name: Run go vet fallback
        if: ${{ hashFiles('.golangci.yml', '.golangci.yaml') == '' }}
        run: go vet ./...
