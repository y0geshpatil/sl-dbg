name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          # GoReleaser publishes the release to y0geshpatil/sl-dbg-releases
          # (public), not to this private source repo. The cross-repo PAT
          # must have `contents: write` on the releases repo.
          GITHUB_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
          # Personal access token with `repo` scope on the homebrew-sl-dbg tap.
          # Required only for the brew publishing step.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
