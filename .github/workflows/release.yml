name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test before publishing
        run: go test ./...

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Build Java adapter jar
        run: make java-adapter

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.16.0
          args: release --clean
        env:
          # Uses the built-in GITHUB_TOKEN — release publishes to this same repo.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
